<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maintenance Manager — Reset equipment records</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 3rem auto; max-width: 42rem; padding: 0 1rem; }
    button { background: #a31919; border: 0; border-radius: 4px; color: white; cursor: pointer; font: inherit; padding: .7rem 1rem; }
    #status { margin-top: 1rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Reset equipment records</h1>
  <p>This removes only the saved Equipment collection (<code>equipment_records_v1</code>) for this app in this browser. Other tables, settings, and browser data are not changed.</p>
  <button id="reset" type="button">Delete equipment records</button>
  <p id="status" role="status" aria-live="polite"></p>
  <script>
    const key = 'equipment_records_v1';
    const status = document.getElementById('status');
    document.getElementById('reset').addEventListener('click', () => {
      if (!window.confirm('Permanently delete all saved Equipment records for this app in this browser?')) return;
      try {
        const existing = window.localStorage.getItem(key);
        const count = existing ? (JSON.parse(existing).length ?? 0) : 0;
        window.localStorage.removeItem(key);
        status.textContent = `Deleted the Equipment records (${count} row(s) were stored).`;
      } catch (error) {
        status.textContent = `Could not clear Equipment records: ${error}`;
      }
    });
  </script>
</body>
</html>
